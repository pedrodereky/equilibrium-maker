name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Tipos, lint, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # O package-lock.json fixa as versões; npm install (e não npm ci) porque
      # o lockfile gerado no macOS não lista binários opcionais de Linux.
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
